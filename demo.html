<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo: asistente de WhatsApp para barbería</title>
<style>
:root{--bg:#efeae2;--head:#128c4a;--card:#fff;--fg:#1b1f1d;--muted:#5b6560;--mine:#d9fdd3;--line:#d8dcd6;--chip:#fff;--accent:#128c4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141a;--head:#1f2c34;--card:#202c33;--fg:#e9edef;--muted:#9aa7ad;--mine:#005c4b;--line:#2a3942;--chip:#1f2c34;--accent:#2fbf71}}
:root[data-theme="dark"]{--bg:#0b141a;--head:#1f2c34;--card:#202c33;--fg:#e9edef;--muted:#9aa7ad;--mine:#005c4b;--line:#2a3942;--chip:#1f2c34;--accent:#2fbf71}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{background:var(--head);color:#fff;padding:12px 16px}
header b{display:block;font-size:1.05rem}
header small{opacity:.85}
.note{background:var(--card);border-bottom:1px solid var(--line);color:var(--muted);font-size:.82rem;padding:8px 16px}
#chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:8px 12px;border-radius:12px;background:var(--card);white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:var(--mine)}
.bot{align-self:flex-start}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opts button{border:1px solid var(--accent);background:var(--chip);color:var(--accent);padding:7px 12px;border-radius:18px;font:inherit;font-size:.9rem;cursor:pointer}
.typing{color:var(--muted);font-style:italic}
.bar{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
.bar input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:20px;padding:10px 14px;font:inherit}
.bar button{border:0;background:var(--accent);color:#fff;border-radius:20px;padding:0 18px;font:inherit;font-weight:600}
.cta{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:12px;margin:0}
</style>
</head>
<body>
<header><b>Barbería Demo 💈</b><small>Asistente virtual · en línea</small></header>
<div class="note">Esto es una demo. Pruébala como si fueras un cliente: toca los botones o escribe.</div>
<div id="chat"></div>
<form class="bar" id="f" onsubmit="return false">
  <input id="t" placeholder="Escribe un mensaje" autocomplete="off">
  <button id="s" type="button">Enviar</button>
</form>
<a class="cta" id="cta" href="#">Quiero esto para mi negocio</a>
<script>
var NUMERO="573159424018";
document.getElementById("cta").href="https://wa.me/"+NUMERO+"?text="+encodeURIComponent("Hola, probé la demo de la barbería y quiero un asistente para mi negocio.");
var chat=document.getElementById("chat"),inp=document.getElementById("t");
var MENU=["Precios","Horarios","Agendar cita","Ubicación"];
var st={step:null,d:{}};

function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function scroll(){chat.scrollTop=chat.scrollHeight}
function add(who,text,opts){
  var m=document.createElement("div");m.className="m "+who;
  var p=document.createElement("div");p.textContent=text;m.appendChild(p);
  if(opts){var o=document.createElement("div");o.className="opts";
    opts.forEach(function(x){var b=document.createElement("button");b.type="button";b.textContent=x;b.onclick=function(){send(x)};o.appendChild(b)});
    m.appendChild(o)}
  chat.appendChild(m);scroll();
}
function botSay(text,opts,delay){
  var t=document.createElement("div");t.className="m bot typing";t.textContent="escribiendo…";chat.appendChild(t);scroll();
  setTimeout(function(){chat.removeChild(t);add("bot",text,opts)},delay||700);
}
function send(text){
  text=(text||"").trim();if(!text)return;
  add("me",text);inp.value="";reply(text);
}
function menu(msg){botSay(msg||"¿En qué más te ayudo?",MENU)}

function reply(raw){
  var q=norm(raw);
  if(st.step==="service"){
    if(/corte|barba/.test(q)){st.d.service=raw;st.step="day";return botSay("Perfecto 💈 ¿Para qué día?",["Hoy","Mañana","Sábado"])}
    return botSay("Elige un servicio:",["Corte clásico","Corte + barba","Barba"])
  }
  if(st.step==="day"){
    st.d.day=raw;st.step="hour";return botSay("Estas horas están libres:",["10:00 am","2:00 pm","4:30 pm"])
  }
  if(st.step==="hour"){
    st.d.hour=raw;st.step="name";return botSay("¿A nombre de quién agendo la cita?")
  }
  if(st.step==="name"){
    st.d.name=raw;st.step=null;var d=st.d;
    botSay("✅ Listo, "+d.name+". Tu cita quedó así:\n\n💈 "+d.service+"\n📅 "+d.day+"\n🕒 "+d.hour+"\n\nTe enviaré un recordatorio antes de tu cita.");
    setTimeout(function(){
      botSay("⏰ Recordatorio automático\n\nHola "+d.name+", te recordamos tu cita de "+d.service.toLowerCase()+" ("+d.day.toLowerCase()+" a las "+d.hour+"). Si no puedes venir, respóndeme y la reagendamos 🙏",["Confirmar","Reagendar"],900)
    },4200);
    return;
  }
  if(/confirm/.test(q)) return botSay("¡Excelente! Te esperamos 🙌",MENU);
  if(/reagend/.test(q)){st.step="day";return botSay("Sin problema. ¿Para qué día la movemos?",["Hoy","Mañana","Sábado"])}
  if(/precio|cuanto|valor|cuesta/.test(q)) return botSay("💈 Precios\n\nCorte clásico: $15.000\nCorte + barba: $25.000\nBarba: $12.000\nCorte niño: $12.000",MENU);
  if(/horario|abren|cierran|hora/.test(q)) return botSay("🕒 Horarios\n\nLunes a sábado: 9:00 am a 8:00 pm\nDomingos: 10:00 am a 4:00 pm",MENU);
  if(/cita|agendar|reserv|turno/.test(q)){st.step="service";return botSay("¡Claro! ¿Qué servicio quieres?",["Corte clásico","Corte + barba","Barba"])}
  if(/ubicacion|direccion|donde|queda/.test(q)) return botSay("📍 Estamos en el centro de Buenaventura.\n(Aquí iría la dirección real de tu negocio.)",MENU);
  if(/gracias|listo|ok/.test(q)) return botSay("¡De nada! Aquí estaré 🙌",MENU);
  if(/hola|buenas|buenos/.test(q)) return menu("¡Hola! 👋 Soy el asistente de Barbería Demo. ¿En qué te ayudo?");
  botSay("No te entendí del todo 🙂 Elige una opción:",MENU);
}
document.getElementById("s").onclick=function(){send(inp.value)};
inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send(inp.value)}});
menu("¡Hola! 👋 Bienvenido a Barbería Demo. Soy el asistente virtual. ¿En qué te ayudo?");
</script>
</body>
</html>
